<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color: rgb(255, 83, 140); font-size: 40px; text-align: center;" >☆*: .｡Introdução ao CSS.｡.:*☆ </h1>

    <p style="color: rgb(255, 252, 253); font-size: 20px; text-align: center; background-color: rgb(255, 159, 207);" >O CSS é uma tecnologia para estilizar páginas</p>
    <p style="color: rgb(247, 75, 127); text-align: center;" >Ele funciona em conjutno com o HTML</p>

    <button style="color: rgb(255, 133, 174); background-color: rgb(255, 255, 255);" >Concordo</button>
    <button style="color: rgb(231, 231, 231); background-color: rgb(248, 96, 167);" >Discord</button>


    <!-- style -  é um atributo funcional em qualquer tag
     color -  nome da cor em inglês
     rgb - 
     Font-size / tamanho da fonte
     '';'' para separar os comandos
     text-align, muda os itens de lugar na página
     background-color- cor dos botões -->
</body>
</html>
